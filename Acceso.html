<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Acceso al CRM</title>
<script src="runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#0F172A;color:#1A1D23}
a{text-decoration:none}
button{font-family:inherit}
a:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid #1D4ED8;outline-offset:2px}
</style>
</helmet>
<div style="box-sizing: border-box; width: 100%; min-height: 820px; display: flex; align-items: center; justify-content: center; padding: 32px; background: #0F172A; font-family: 'Inter', system-ui, sans-serif">
  <div style="box-sizing: border-box; width: 100%; max-width: 420px; background: #FFFFFF; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Tu CRM</h1>
      <p style="margin: 0; font-size: 14px; color: #5B6270">Entra con tu correo y tu contraseña.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="correo" style="font-size: 13px; font-weight: 600; color: #3A4150">Correo</label>
      <input id="correo" type="email" placeholder="tucorreo@ejemplo.com" style="box-sizing: border-box; min-height: 44px; border: 1px solid #C9CED8; border-radius: 8px; padding: 0 12px; font-size: 14px; font-family: inherit">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="clave" style="font-size: 13px; font-weight: 600; color: #3A4150">Contraseña</label>
      <input id="clave" type="password" style="box-sizing: border-box; min-height: 44px; border: 1px solid #C9CED8; border-radius: 8px; padding: 0 12px; font-size: 14px; font-family: inherit">
    </div>
    <a href="Proyectos.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #1D4ED8; color: #FFFFFF; font-size: 15px; font-weight: 600">Entrar</a>
    <a href="#" style="font-size: 13px; color: #1D4ED8; text-align: center; min-height: 32px; display: flex; align-items: center; justify-content: center">¿Olvidaste tu contraseña?</a>
    <p style="margin: 0; font-size: 13px; color: #5B6270; text-align: center">¿Eres nuevo? <a href="Registro.html" style="color: #1D4ED8; font-weight: 600">Crea tu cuenta</a></p>
    <p style="margin: 0; font-size: 12px; color: #5B6270; text-align: center">Maqueta: este botón solo te lleva a la siguiente pantalla.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":820}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
